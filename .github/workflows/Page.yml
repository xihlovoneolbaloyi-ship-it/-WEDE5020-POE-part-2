name: Sweet Crumbs Bakery CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate-project:
    name: Validate Project Structure
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Display Repository Structure
        run: |
          echo "Repository Structure"
          echo "===================="
          ls -R

      - name: 📄 Verify Required HTML Files
        run: |
          files=(
            index.html
            about.html
            products.html
            services.html
            gallery.html
            enquiry.html
            contact.html
          )

          for file in "${files[@]}"
          do
            if [ ! -f "$file" ]; then
              echo "Missing file: $file"
              exit 1
            fi
          done

          echo "All HTML files found."

      - name: 🎨 Verify CSS Files
        run: |
          test -f css/style.css
          test -f css/responsive.css
          test -f css/animations.css
          echo "CSS verified."

      - name: ⚙ Verify JavaScript Files
        run: |
          test -f js/script.js
          test -f js/validation.js
          test -f js/gallery.js
          echo "JavaScript verified."

      - name: 🖼 Verify Images Folder
        run: |
          test -d images
          echo "Images folder exists."

      - name: 📚 Verify Documentation
        run: |
          test -d docs
          test -f README.md
          echo "Documentation verified."

  html-validation:
    name: HTML Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Validate HTML Files
        run: |
          htmlhint "**/*.html"

  css-validation:
    name: CSS Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Stylelint
        run: |
          npm install -g stylelint
          npm install -g stylelint-config-standard

      - name: Create Stylelint Configuration
        run: |
          cat <<EOF > .stylelintrc.json
          {
            "extends": "stylelint-config-standard"
          }
          EOF

      - name: Validate CSS Files
        run: |
          stylelint "css/**/*.css"

  javascript-validation:
    name: JavaScript Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ESLint
        run: npm install -g eslint

      - name: Create ESLint Configuration
        run: |
          cat <<EOF > eslint.config.mjs
          export default [
            {
              languageOptions: {
                ecmaVersion: "latest",
                sourceType: "script"
              },
              rules: {}
            }
          ];
          EOF

      - name: Validate JavaScript
        run: |
          eslint js/*.js

  link-check:
    name: Check Internal Links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Link Checker
        run: npm install -g html-proofer

      - name: Display HTML Files
        run: find . -name "*.html"

  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Required Files
        run: |
          test -f README.md
          test -f LICENSE

      - name: Count Repository Files
        run: |
          echo "Total Files:"
          find . -type f | wc -l

      - name: Count HTML Files
        run: |
          echo "HTML Files:"
          find . -name "*.html" | wc -l

      - name: Count CSS Files
        run: |
          echo "CSS Files:"
          find . -name "*.css" | wc -l

      - name: Count JavaScript Files
        run: |
          echo "JavaScript Files:"
          find . -name "*.js" | wc -l

      - name: Display Largest Files
        run: |
          find . -type f -exec du -h {} + | sort -hr | head

  upload-build-report:
    name: Upload Repository Report
    runs-on: ubuntu-latest
    needs:
      - validate-project
      - html-validation
      - css-validation
      - javascript-validation
      - repository-quality

    steps:
      - uses: actions/checkout@v4

      - name: Generate Report
        run: |
          echo "# Sweet Crumbs Bakery CI Report" > report.txt
          echo "" >> report.txt
          echo "Validation completed successfully." >> report.txt
          echo "" >> report.txt
          echo "Repository passed all configured checks." >> report.txt
          echo "" >> report.txt
          date >> report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: CI-Validation-Report
          path: report.txt

  success-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - validate-project
      - html-validation
      - css-validation
      - javascript-validation
      - repository-quality
      - upload-build-report

    steps:
      - name: Final Summary
        run: |
          echo "=========================================="
          echo "Sweet Crumbs Bakery"
          echo "Continuous Integration Pipeline"
          echo "=========================================="
          echo "Project Structure        Passed"
          echo "HTML Validation          Passed"
          echo "CSS Validation           Passed"
          echo "JavaScript Validation    Passed"
          echo "Repository Quality       Passed"
          echo "Build Report             Uploaded"
          echo ""
          echo "Pipeline completed successfully."
          echo "=========================================="
